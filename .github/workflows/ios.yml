name: Build iPhone app

# Builds Cat Bridge on GitHub's free Mac machines and uploads an UNSIGNED .ipa.
# Install it with Sideloadly (Windows) using your own Apple ID — see README.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: Packages/CatBridgeCore
        run: swift test

  ios:
    name: iPhone app (unsigned .ipa)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project CatBridge.xcodeproj \
            -scheme CatBridge \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CatBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log | grep -E "error:|warning: .*(deprecated|will be an error)|\*\* ARCHIVE" || true
          test -d build/CatBridge.xcarchive || { grep -n "error:" build/archive.log | head -50; exit 1; }
      - name: Package unsigned IPA
        run: bash scripts/package-unsigned-ipa.sh build/CatBridge.xcarchive build/CatBridge-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CatBridge-unsigned-ipa
          path: build/CatBridge-unsigned.ipa
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: build/archive.log
          retention-days: 7
