name: iPhone app

# Builds Cat Bridge for iPhone on GitHub's Mac machines and uploads an UNSIGNED .ipa
# (install it with Sideloadly using your own Apple ID).

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        working-directory: ios/Packages/CatBridgeCore
        run: swift test

  ios:
    name: Unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: echo "::notice title=Toolchain::$(xcodebuild -version | tr '\n' ' ')"
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project CatBridge.xcodeproj -scheme CatBridge -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/CatBridge.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build/archive.log | grep -E "error:|\*\* ARCHIVE" || true
          test -d build/CatBridge.xcarchive || { grep -n "error:" build/archive.log | head -50; exit 1; }
      - name: Package
        run: bash scripts/package-unsigned-ipa.sh build/CatBridge.xcarchive build/CatBridge.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CatBridge-ipa
          path: ios/build/CatBridge.ipa
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: ios/build/archive.log
          retention-days: 7
