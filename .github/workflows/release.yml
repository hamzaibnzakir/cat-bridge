name: Release

# Builds both apps and publishes them on the Releases page.
# Either push a tag like v2.1.0, or run it from Actions → Release → Run workflow and type the version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v2.1.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  ios:
    uses: ./.github/workflows/ios.yml

  publish:
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "{DynamicIsland-windows,CatBridge-ipa}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          ls -la dist
          notes=$(awk -v v="${TAG#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$TAG" dist/DynamicIsland-Setup.exe dist/DynamicIsland-windows.zip dist/CatBridge.ipa \
            --target "$GITHUB_SHA" --title "Cat Bridge $TAG" --notes "${notes:-See CHANGELOG.md}"
