name: Release

# Push a tag like v2.1.0 to build both apps and publish them on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
  ios:
    uses: ./.github/workflows/ios.yml

  publish:
    needs: [windows, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: "{DynamicIsland-windows,CatBridge-ipa}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/DynamicIsland-windows.zip dist/CatBridge.ipa \
            --title "Cat Bridge $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
