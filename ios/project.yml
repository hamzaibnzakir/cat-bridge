# XcodeGen spec. The .xcodeproj is generated, so it never drifts:
#   brew install xcodegen && xcodegen generate
name: CatBridge
options:
  bundleIdPrefix: app.catbridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  CatBridgeCore:
    path: Packages/CatBridgeCore

targets:
  CatBridge:
    type: application
    platform: iOS
    sources:
      - path: CatBridge
    dependencies:
      - package: CatBridgeCore
    info:
      path: CatBridge/Info.plist
      properties:
        CFBundleDisplayName: Cat Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Cat Bridge uses the camera to scan the pairing code shown on your laptop.
        NSLocalNetworkUsageDescription: Cat Bridge connects to your laptop over Tailscale.
        NSAppTransportSecurity:
          # The laptop is reached over Tailscale (WireGuard-encrypted) at its 100.x address, so plain HTTP inside the tailnet is fine.
          # Note: don't add NSAllowsLocalNetworking here. When it's present, iOS ignores NSAllowsArbitraryLoads and blocks http://100.x.
          NSAllowsArbitraryLoads: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.catbridge.pair
            CFBundleURLSchemes:
              - catbridge
        LSApplicationQueriesSchemes:
          - tailscale
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.catbridge.phone
        PRODUCT_NAME: CatBridge
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

schemes:
  CatBridge:
    build:
      targets:
        CatBridge: all
    archive:
      config: Release
